name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - name: npm test
        shell: bash
        env:
          # macOS also proves generated Python clients run on the system Python 3.9 (no typing_extensions).
          REA_FROM_API_PYTHON: ${{ runner.os == 'macOS' && '/usr/bin/python3' || '' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # Surface failing tests as annotations (readable on the run page without opening logs).
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          grep -nE "^\s*✖|AssertionError|Error \[|error:" test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error title=test failure::${line//%/%25}"
          done
      # The published package must work from node_modules (compiled dist/, hoisted deps).
      - name: Pack and run from a clean install
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/clean" && cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/rea-from-api-*.tgz --no-audit --no-fund
          node node_modules/rea-from-api/bin/rea-from-api.mjs --version
          node node_modules/rea-from-api/bin/rea-from-api.mjs doctor
